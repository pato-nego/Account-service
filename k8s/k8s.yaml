apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
data:
  DATABASE_PORT: '5432'
  SPRING_DATASOURCE_URL: 'jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}?sslmode=verify-full&sslrootcert=/etc/rds/bundle.pem'
---
apiVersion: v1
kind: Secret
metadata:
  name: account-credentials
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: rds-trust
        configMap:
          name: rds-ca
      containers:
      - name: account
        image: pato-nego/account:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: rds-trust
          mountPath: /etc/rds
          readOnly: true
        envFrom:
        - configMapRef:
            name: account-config
        env:
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: account-credentials
              key: DATABASE_HOST
        - name: DATABASE_DB
          valueFrom:
            secretKeyRef:
              name: account-credentials
              key: DATABASE_DB
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: account-credentials
              key: DATABASE_USERNAME
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: account-credentials
              key: DATABASE_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /accounts/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /accounts/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /accounts/health-check
            port: http
          timeoutSeconds: 3
          periodSeconds: 15
  replicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  type: ClusterIP
  selector:
    app: account
  ports:
  - name: http
    port: 8080
    targetPort: http
